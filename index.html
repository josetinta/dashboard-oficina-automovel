.ib{display:flex;align-items:center;justify-content:center;border-radius:11px;background:#33393f;color:#f0f2f4;cursor:pointer;transition:background .2s,color .2s}
.ib:hover{background:#f39a4a;color:#13161a}
.bt{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;font:600 12px 'Inter',sans-serif;cursor:pointer;white-space:nowrap}
.bar{transition:all .5s}
@keyframes pu{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.6)}}
.pl{animation:pu 2.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
.bk{animation:bl 1.4s infinite}
#sheet{display:none;position:absolute;left:-2000px;top:-2000px;width:5500px;height:5000px;z-index:20;background:rgba(13,6,23,.8)}
#sheet .card{position:absolute;left:2097px;top:2070px;width:1300px;height:700px;background:#21262b;border:1px solid #575f66;border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.55);padding:24px 32px;overflow:hidden;color:#f6f7f9}
#sheet h3{font:700 20px 'Inter',sans-serif}
#sheet .hint{font:500 12px 'Inter',sans-serif;color:#c1c7ce;margin-top:4px}
#sheet h4{font:600 12px 'Inter',sans-serif;color:#c1c7ce;letter-spacing:1px;text-transform:uppercase;margin:14px 0 6px}
#sheet table{border-collapse:separate;border-spacing:0;width:100%;font:500 12.5px 'Inter',sans-serif}
#sheet th{background:#33393f;color:#f39a4a;font-weight:600;font-size:10.5px;padding:7px 3px;text-align:center}
#sheet th:first-child{border-radius:10px 0 0 10px}#sheet th:last-child{border-radius:0 10px 10px 0}
#sheet td{padding:3px 4px;text-align:center;border-bottom:1px solid #495057;outline:0}
#sheet td:first-child{font-weight:700;text-align:left;padding-left:12px;color:#f39a4a}
#sheet td[contenteditable]:focus{background:#5d656d;border-radius:8px}
#sheet td[contenteditable]:hover{background:#353b41}
.mb{display:flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:19px;font:600 13px 'Inter',sans-serif;cursor:pointer;border:0}
